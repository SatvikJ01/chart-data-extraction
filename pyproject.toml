[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-extraction"
version = "0.1.0"
description = "Chart image -> structured data series (Benetech Making Graphs Accessible)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["chart_extraction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::SyntaxWarning"]
